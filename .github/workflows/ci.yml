name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - run: mkdir -p .artifacts && pnpm --filter @reposync/core pack --pack-destination .artifacts && pnpm --filter @reposync/cli pack --pack-destination .artifacts

      - run: tar -tf .artifacts/reposync-core-1.0.0.tgz | grep -E 'package/(dist/index.js|dist/index.d.ts|package.json|README.md|LICENSE)$'

      - run: tar -tf .artifacts/reposync-cli-1.0.0.tgz | grep -E 'package/(dist/index.js|dist/index.d.ts|package.json|README.md|LICENSE)$'

      - run: pnpm audit --audit-level high
